# NATS/JetStream server backing the mind-event relay (MIND_EVENTS stream).
#
# Deliberately its own small broker, NOT the shared quantum-feed bus
# (k8s NATS at 10.152.183.166:4222 / NodePort 30422, ~50K events/sec, core
# NATS only, no JetStream — see quantum-feed/k8s/bus/nats.yaml). Mind's event
# volume (news/filings/analyst actions) is orders of magnitude smaller and
# needs JetStream replay-by-sequence, which the shared bus does not run.
# Also not qf-engine's own NATS (127.0.0.1:4222 on server5, localhost-only,
# reserved for BAR_LEDGER_24H) — port collision aside, that one is
# deliberately unreachable off-host and this relay must be LAN-reachable so
# tradedesk's k8s pods can subscribe.
host: "0.0.0.0"
port: 4223
http_port: 8223
server_name: "mind-relay-nats"

jetstream {
  store_dir: "/data"
  # 2026-10-02: raised from 2GiB after it was hit for real -- a new,
  # much-higher-volume event type ("signal") filled the old ceiling in ~2.3
  # days (7-day age-based retention never got a chance to evict anything),
  # and every publish failed silently (insufficient resources) for ~17.5h
  # until found live. 10GiB is still a ceiling against ./data on the NAS
  # (73.3T total, 5.8T free as of 2026-10-02), not a reservation target.
  # The STREAM's own max_bytes (relay.py, set below this) is the real,
  # self-trimming limit now -- this is just headroom so the stream's
  # auto-trim is never racing the account's hard cap.
  max_file_store: 10737418240
  max_memory_store: 268435456
}
