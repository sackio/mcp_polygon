[project]
name = "mcp_massive"
version = "0.5.0"
description = "A MCP server project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # mcp 2.x restructured mcp.server.fastmcp (broke this import); upstream itself
    # is pinned to 1.27.0. Stay in the 1.x line until that's re-verified.
    "mcp[cli]>=1.27.0,<2.0.0",
    "polygon-api-client>=1.15.3",
    "boto3>=1.35.0",
    "pyarrow>=17.0.0",
    "pymongo>=4.6.0",
    # polygon-api-client (old tool set) pins certifi<2026.0.0; upstream mcp_massive
    # wants >=2026.2.25 but that floor isn't load-bearing for anything we use here.
    "certifi>=2022.5.18,<2026.0.0",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "pydantic>=2.12.5",
    "sqlglot>=30.4.0",
    # pure-Python, no key/network — 211 exchange calendars, historical session
    # schedules with open/close times (including early closes). vectorbtpro's
    # own utils/sessions.py already requires it; we wrap it for get_trading_sessions.
    "pandas-market-calendars>=4.0.0",
    # Factor models (Fama-French, AQR, q, ...): OUR fork of getfactormodels, pinned to a COMMIT
    # (carries 3 fixes the PyPI 0.0.27 pre-alpha lacks). Tarball URL because the container has no git.
    "getfactormodels @ https://github.com/sackio/getfactormodels/archive/b9675ab.tar.gz",
    "nats-py>=2.16.0",
    "msgpack>=1.2.2",
    # restricted expression evaluator for the generalized live-trigger API
    # (register_live_alert's "trigger" condition kind) — never eval()/exec()
    # on an agent-submitted expr in this shared process.
    "simpleeval>=1.0.3",
]
[[project.authors]]
name = "Massive"
email = "support@massive.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# getfactormodels is pinned by URL (commit tarball): hatchling refuses direct references otherwise
allow-direct-references = true

[dependency-groups]
dev = [
    "ruff>=0.12.4",
]

[project.scripts]
mcp_massive = "mcp_massive:run"
